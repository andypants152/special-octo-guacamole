<!DOCTYPE html>
<html>
  <head>
    <title>Card Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #183026;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      body {
        display: block;
      }

      canvas#game {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        max-width: none;
        max-height: none;
        touch-action: none;
      }

      @supports (height: 100dvh) {
        canvas#game {
          height: 100dvh;
        }
      }

      @media (max-width: 600px) {
        .qr-container {
          width: min(360px, 90vw);
          padding: 20px 20px 28px;
        }

        .qr-container h2 {
          font-size: 20px;
        }

        .qr-canvas {
          width: min(240px, 70vw);
          height: min(240px, 70vw);
        }

        .qr-button {
          min-height: 44px;
          font-size: 16px;
          padding: 12px 18px;
        }
      }

      .qr-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .qr-overlay.visible {
        display: flex;
      }

      .qr-container {
        background: #f7f9fb;
        border-radius: 16px;
        padding: 24px 28px 32px;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
        text-align: center;
        max-width: 90vw;
        color: #172b3a;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      .qr-container h2 {
        margin: 0 0 16px;
        font-size: 22px;
      }

      .qr-canvas {
        width: 260px;
        height: 260px;
        image-rendering: pixelated;
      }

      .qr-link {
        margin-top: 18px;
        font-size: 15px;
        word-break: break-word;
        color: #0d47a1;
      }

      .qr-share-id {
        margin-top: 8px;
        font-size: 18px;
        font-weight: 600;
        color: #1b2838;
      }

      .qr-actions {
        margin-top: 20px;
        display: flex;
        justify-content: center;
        gap: 16px;
      }

      .qr-button {
        background: #0d47a1;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 15px;
        cursor: pointer;
      }

      .qr-button.secondary {
        background: transparent;
        color: #0d47a1;
        border: 1px solid rgba(13, 71, 161, 0.4);
      }

      .qr-button:hover {
        filter: brightness(1.05);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="index.js"></script>
  </body>
</html>
